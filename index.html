<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/kanee/favicon.svg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaneeta Zahid</title>
    <meta name="description" content="Portfolio of Kaneeta Zahid: Digital Ambassador Intern at NYLP, McKinsey Forward Participant, Digital HR &amp; AI enthusiast and Aspire Leaders Program alumna." />
    <meta property="og:title" content="Kaneeta Zahid" />
    <meta name="twitter:title" content="Kaneeta Zahid" />
    <meta name="application-name" content="Kaneeta Zahid" />
    <meta property="og:description" content="Building people-centric solutions for a smarter, more inclusive future." />
    <meta property="og:image" content="https://arifuzzamanraihan.github.io/kanee/og-banner.jpg" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
